<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .t { font-family: "IBM Plex Sans", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; font-size: 14px; fill: #1a1a1a; }
      .h { font-family: "IBM Plex Sans", "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
      .s { font-size: 12px; fill: #444; }
      .mono { font-family: "IBM Plex Mono", "Noto Sans Mono", monospace; font-size: 13px; fill: #111; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f7f5f0"/>
  
  <text class="h" x="28" y="36">本步里三个数：computed / scheduled / p</text>
  <text class="t" x="28" y="62">一条 request 的 token 轴（位置从 0 起）</text>

  <!-- axis -->
  <line x1="40" y1="160" x2="880" y2="160" stroke="#333" stroke-width="2"/>
  <polygon points="880,160 868,154 868,166" fill="#333"/>

  <!-- already computed -->
  <rect x="40" y="120" width="220" height="40" fill="#9ec5e8" stroke="#2b6cb0" stroke-width="1.5"/>
  <text class="mono" x="70" y="145">computed = c</text>
  <text class="s" x="55" y="110">已经算过、KV 里已有</text>

  <!-- this step scheduled -->
  <rect x="260" y="120" width="280" height="40" fill="#f6d58a" stroke="#b7791f" stroke-width="1.5"/>
  <text class="mono" x="310" y="145">本步 scheduled = s</text>
  <text class="s" x="300" y="110">本步新拿来算的 token</text>

  <!-- not yet -->
  <rect x="540" y="120" width="200" height="40" fill="#e8e4dc" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="s" x="575" y="145">还没排到本步</text>

  <!-- p marker -->
  <line x1="700" y1="90" x2="700" y2="200" stroke="#c53030" stroke-width="2.5"/>
  <text class="mono" x="708" y="108" fill="#c53030">p = prompt end</text>
  <text class="s" x="708" y="128">双向区右边界</text>

  <!-- labels under -->
  <text class="mono" x="40" y="210">pos 0</text>
  <text class="mono" x="245" y="210">c</text>
  <text class="mono" x="525" y="210">c + s</text>
  <text class="mono" x="690" y="210">p</text>
  <text class="mono" x="820" y="210">L</text>

  <rect x="40" y="250" width="840" height="140" rx="8" fill="#fff" stroke="#ccc"/>
  <text class="t" x="60" y="280">人话对照（vLLM scheduler 口径）</text>
  <text class="t" x="60" y="310">• <tspan class="mono">computed (c)</tspan>：这条请求到本步开始前，已经算完、写进 KV cache 的 token 数</text>
  <text class="t" x="60" y="340">• <tspan class="mono">scheduled (s)</tspan>：本步调度器分配给它、这次 forward 要新算的 token 数</text>
  <text class="t" x="60" y="370">• <tspan class="mono">p</tspan>：插件认定的「prompt 双向区」长度；fix-up 只覆盖本步出现的行 [a0, a0+p)</text>

</svg>
